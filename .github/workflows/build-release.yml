name: Build & Publish Leyline Release

# Every run builds the driver, the app and Leyline-Setup.exe and uploads them as a workflow artifact.
# A GitHub release is published only for a version, each in its own release that is never overwritten:
#   - push a tag:  git tag v2.0.1 && git push origin v2.0.1
#   - or Actions > Build & Publish Leyline Release > Run workflow, with "version" filled in (creates the tag)
# Pushes to main and pull requests only build.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release for this version (e.g. 2.0.1). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows x64 Release
    # Visual Studio 2026: the WDK NuGet package (10.0.28000) only ships build tasks for VS 18.
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $requested = "${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}".Trim().TrimStart("v")
          $release = $false
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $release = $true
          } elseif ($requested) {
            $version = $requested
            $release = $true
          } else {
            $base = ([xml](Get-Content src/Leyline/Leyline.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $version = "$base.${{ github.run_number }}"
          }
          if ($release -and $version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "Version '$version' is not like 2.0.1." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "Leyline $version$(if ($release) { ' (release)' })"

      # Never overwrite a published version: stop before building if its release already exists
      - name: Check the release does not exist yet
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release v${{ steps.version.outputs.version }} already exists. Publish a new version number instead." }
          $global:LASTEXITCODE = 0

      # ---- Leyline Virtual Audio driver --------------------------------------------------------------
      - name: Restore WDK NuGet packages
        run: nuget restore driver/LeylineVAD/packages.config -PackagesDirectory driver/LeylineVAD/packages

      - name: Build driver
        shell: pwsh
        run: ./driver/LeylineVAD/Build-Driver.ps1 -Configuration Release

      - name: Package and test-sign driver
        shell: pwsh
        run: ./driver/LeylineVAD/Package-Driver.ps1 -Configuration Release

      # ---- App (bundles driver\LeylineVAD\out\Release into its Driver\ folder) -------------------------
      - name: Publish Leyline (WinUI 3 win-x64 Release)
        run: dotnet publish src/Leyline/Leyline.csproj -c Release -p:Platform=x64 -p:Version=${{ steps.version.outputs.version }} -o dist/Leyline/publish

      - name: Check bundled driver package
        shell: pwsh
        run: |
          $driver = "dist/Leyline/publish/Driver"
          foreach ($file in "LeylineVAD.inf", "LeylineVAD.sys", "leylinevad.cat", "LeylineTestCert.cer") {
            if (-not (Test-Path (Join-Path $driver $file))) { throw "Missing $file in the published Driver folder." }
          }
          Select-String -Path "$driver/LeylineVAD.inf" -Pattern "DriverVer" | Select-Object -First 1

      # ---- Installer ----------------------------------------------------------------------------------
      - name: Build Leyline-Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$PWD\dist\Leyline\publish" "/DOutputDir=$PWD\dist" installer\Leyline.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Leyline/publish/*" -DestinationPath "dist/Leyline-win-x64-portable.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Leyline-win-x64
          path: |
            dist/Leyline-Setup.exe
            dist/Leyline-win-x64-portable.zip

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Leyline ${{ steps.version.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Leyline ${{ steps.version.outputs.version }}
            Audio router, matrix mixer and VST host for Windows 10 (2004+) and 11.
            Built by GitHub Actions from commit `${{ github.sha }}`.

            ### Install
            1. Run **`Leyline-Setup.exe`**.
            2. On first launch, Leyline asks to install its virtual audio driver (one administrator approval).
               When an update ships a newer driver, Leyline asks again to update it.

            The driver is currently **test-signed**: Windows loads it only with test signing on.
            Run `bcdedit /set testsigning on` in an administrator terminal and reboot before installing the driver.

            `Leyline-win-x64-portable.zip` contains the same files without an installer.
          files: |
            dist/Leyline-Setup.exe
            dist/Leyline-win-x64-portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
