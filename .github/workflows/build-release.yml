name: Build & Publish Leyline Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Pull requests into main build and upload Leyline-Setup.exe as a workflow artifact, without publishing a release.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows x64 Release
    # Visual Studio 2022 + Windows Driver Kit (Microsoft has not validated driver builds with VS 2026 yet).
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $base = ([xml](Get-Content src/Leyline/Leyline.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $version = "$base.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Leyline $version"

      # ---- Leyline Virtual Audio driver --------------------------------------------------------------
      - name: Restore WDK NuGet packages
        run: nuget restore driver/LeylineVAD/packages.config -PackagesDirectory driver/LeylineVAD/packages

      - name: Build driver
        shell: pwsh
        run: ./driver/LeylineVAD/Build-Driver.ps1 -Configuration Release

      - name: Package and test-sign driver
        shell: pwsh
        run: ./driver/LeylineVAD/Package-Driver.ps1 -Configuration Release

      # ---- App (bundles driver\LeylineVAD\out\Release into its Driver\ folder) -------------------------
      - name: Publish Leyline (WinUI 3 win-x64 Release)
        run: dotnet publish src/Leyline/Leyline.csproj -c Release -p:Platform=x64 -p:Version=${{ steps.version.outputs.version }} -o dist/Leyline/publish

      - name: Check bundled driver package
        shell: pwsh
        run: |
          $driver = "dist/Leyline/publish/Driver"
          foreach ($file in "LeylineVAD.inf", "LeylineVAD.sys", "leylinevad.cat", "LeylineTestCert.cer") {
            if (-not (Test-Path (Join-Path $driver $file))) { throw "Missing $file in the published Driver folder." }
          }
          Select-String -Path "$driver/LeylineVAD.inf" -Pattern "DriverVer" | Select-Object -First 1

      # ---- Installer ----------------------------------------------------------------------------------
      - name: Build Leyline-Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$PWD\dist\Leyline\publish" "/DOutputDir=$PWD\dist" installer\Leyline.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Leyline/publish/*" -DestinationPath "dist/Leyline-win-x64-portable.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Leyline-win-x64
          path: |
            dist/Leyline-Setup.exe
            dist/Leyline-win-x64-portable.zip

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Leyline {0}', github.ref_name) || 'Leyline Latest Build' }}
          body: |
            ## Leyline ${{ steps.version.outputs.version }}
            Audio router, matrix mixer, soundboard and VST host for Windows 10 (2004+) and 11.
            Built by GitHub Actions from commit `${{ github.sha }}`.

            ### Install
            1. Run **`Leyline-Setup.exe`**.
            2. On first launch, Leyline asks to install its virtual audio driver (one administrator approval).
               When an update ships a newer driver, Leyline asks again to update it.

            The driver is currently **test-signed**: Windows loads it only with test signing on.
            Run `bcdedit /set testsigning on` in an administrator terminal and reboot before installing the driver.

            `Leyline-win-x64-portable.zip` contains the same files without an installer.
          files: |
            dist/Leyline-Setup.exe
            dist/Leyline-win-x64-portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
