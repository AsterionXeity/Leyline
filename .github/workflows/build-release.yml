name: Build & Publish Leyline Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore src/Leyline/Leyline.csproj

      - name: Publish Leyline (WinUI 3 win-x64 Release)
        run: dotnet publish src/Leyline/Leyline.csproj -c Release -p:Platform=x64 -o dist/Leyline/publish

      - name: Stage Installer & Driver Package
        shell: pwsh
        run: |
          Copy-Item "Install-Leyline.ps1" -Destination "dist/Leyline/" -Force
          Copy-Item "README.md" -Destination "dist/Leyline/" -Force
          New-Item -ItemType Directory -Path "dist/Leyline/driver" -Force | Out-Null
          Copy-Item "driver/LeylineVAD" -Destination "dist/Leyline/driver/LeylineVAD" -Recurse -Force
          Compress-Archive -Path "dist/Leyline/*" -DestinationPath "Leyline-win-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leyline-win-x64
          path: Leyline-win-x64.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Leyline {0}', github.ref_name) || 'Leyline Latest Build' }}
          body: |
            ## Leyline Audio Router, Matrix Mixer, Soundboard & VST Host (Windows 10 & 11)
            Automated Windows x64 build generated by GitHub Actions from commit `${{ github.sha }}`.

            ### Included in `Leyline-win-x64.zip`
            - `publish/Leyline.exe` — Main Leyline Studio Application
            - `driver/LeylineVAD/` — Standalone Leyline Virtual Audio Driver & Endpoint Provisioner
            - `Install-Leyline.ps1` — Desktop/Start Menu Shortcut & Auto-Start Installer
          files: |
            Leyline-win-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
