name: Build & Publish VoidPatch Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore src/VoidPatch/VoidPatch.csproj

      - name: Publish VoidPatch (WinUI 3 win-x64 Release)
        run: dotnet publish src/VoidPatch/VoidPatch.csproj -c Release -p:Platform=x64 -o dist/VoidPatch/publish

      - name: Stage Installer & Driver Package
        shell: pwsh
        run: |
          Copy-Item "Install-VoidPatch.ps1" -Destination "dist/VoidPatch/" -Force
          Copy-Item "README.md" -Destination "dist/VoidPatch/" -Force
          New-Item -ItemType Directory -Path "dist/VoidPatch/driver" -Force | Out-Null
          Copy-Item "driver/VoidPatchVAD" -Destination "dist/VoidPatch/driver/VoidPatchVAD" -Recurse -Force
          Compress-Archive -Path "dist/VoidPatch/*" -DestinationPath "VoidPatch-win-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidPatch-win-x64
          path: VoidPatch-win-x64.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('VoidPatch {0}', github.ref_name) || 'VoidPatch Latest Build' }}
          body: |
            ## VoidPatch Audio Router, Matrix Mixer, Soundboard & VST Host (Windows 10 & 11)
            Automated Windows x64 build generated by GitHub Actions from commit `${{ github.sha }}`.

            ### Included in `VoidPatch-win-x64.zip`
            - `publish/VoidPatch.exe` — Main VoidPatch Studio Application
            - `driver/VoidPatchVAD/` — Standalone VoidPatch Virtual Audio Driver & Endpoint Provisioner
            - `Install-VoidPatch.ps1` — Desktop/Start Menu Shortcut & Auto-Start Installer
          files: |
            VoidPatch-win-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
